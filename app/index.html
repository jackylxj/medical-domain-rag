<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>医学知识问答 · RAG Demo</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#18332f;background:#f2f6f3}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:48px auto;padding:0 22px}.eyebrow{color:#51736b;letter-spacing:.14em;font-size:13px}h1{font-size:34px;margin:12px 0}.intro{color:#53675f;line-height:1.8}.card{background:white;border:1px solid #dce6df;border-radius:18px;padding:24px;margin-top:22px;box-shadow:0 8px 30px #18332f05}label{display:block;font-weight:600;margin-bottom:12px}textarea{width:100%;min-height:112px;resize:vertical;padding:14px;border:1px solid #adc4b7;border-radius:10px;font:inherit;line-height:1.6}button{cursor:pointer;border:0;border-radius:9px;background:#16644e;color:white;padding:12px 22px;font:inherit}button:disabled{opacity:.5;cursor:wait}.samples{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}.samples button{font-size:13px;padding:8px 12px;background:#edf4ef;color:#305949}.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}#status{color:#49675c;font-size:14px}#answer{white-space:pre-wrap;line-height:1.9;font-size:17px}summary{cursor:pointer;padding:12px 0;font-weight:600}details{border-top:1px solid #e2e9e4}.evidence{line-height:1.7;color:#496057}a{color:#16644e;overflow-wrap:anywhere}.note{font-size:13px;color:#6c7c75;line-height:1.7}.error{color:#ac342c!important}[hidden]{display:none!important}@media(max-width:600px){main{margin:24px auto}h1{font-size:27px}.card{padding:18px}}
</style></head><body><main>
<div class="eyebrow">MEDICAL KNOWLEDGE / RAG DEMO</div><h1>有据可查的医学知识问答</h1>
<p class="intro">根据当前知识库中的公开资料摘要回答问题，并展示检索依据。资料不足时应明确说明。</p>
<section class="card"><form id="form"><label for="question">你想了解什么？</label><textarea id="question" maxlength="1000" required placeholder="例如：没有头痛为什么也要测血压？"></textarea>
<div class="samples"><button type="button">没有头痛为什么也要测血压？</button><button type="button">哮喘时气道为什么不通畅，吸入药有哪些作用？</button><button type="button">资料中规定每天最多吃多少克食盐？</button></div>
<div class="row"><button id="send" type="submit">检索并回答</button><span id="status" role="status" aria-live="polite">正在检查服务…</span></div></form>
<p class="note">演示版检索与生成可能需要等待，同一时间处理一个问题。请勿输入个人隐私或真实病历。</p></section>
<section id="result" class="card" hidden><h2>回答</h2><div id="answer"></div><h3>检索资料</h3><p class="note">标记“回答引用”的片段对应回答中的编号。检索命中不等于证据充分，引用仍需核对。</p><div id="sources"></div><p id="record" class="note"></p></section>
<p class="note">仅用于医学知识科普与技术实验，不用于个人诊断。知识库为项目编写的公开资料摘要，并非完整医学资料库。具体版本与规模见本次索引构建记录。</p>
</main><script>
const statusEl=document.querySelector('#status'), send=document.querySelector('#send'), question=document.querySelector('#question');
const api=new URL('./',window.location.href);
const labels={queued:'任务已提交',retrieving:'正在检索参考资料…',generating:'正在生成回答…'};
function status(text,error=false){statusEl.textContent=text;statusEl.classList.toggle('error',error)}
async function request(path,options){const r=await fetch(new URL(path,api),options);const data=await r.json();if(!r.ok)throw new Error(typeof data.detail==='string'?data.detail:'请求失败，请检查输入或服务日志。');return data}
function show(job){document.querySelector('#result').hidden=false;document.querySelector('#answer').textContent=job.result.answer;const sources=document.querySelector('#sources');sources.replaceChildren();const cited=new Set(job.result.cited_numbers||[]);for(const e of job.result.evidence||[]){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p'),a=document.createElement('a');s.textContent=`[${e.citation}] ${e.title} · ${e.section}${cited.has(e.citation)?' · 回答引用':''}`;p.className='evidence';p.textContent=e.text;d.append(s,p);try{const url=new URL(e.source);if(['https:','http:'].includes(url.protocol)){a.href=url.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='原文来源 · '+e.version;d.append(a)}}catch{}sources.append(d)}document.querySelector('#record').textContent=`任务编号：${job.id}。服务端任务耗时：${Number(job.elapsed_seconds).toFixed(3)} 秒（不含浏览器网络与轮询）。${job.cache?.status === 'hit' ? '本次复用缓存答案，未重新生成。' : '本次实时生成。'}`}
document.querySelectorAll('.samples button').forEach(b=>b.onclick=()=>{question.value=b.textContent;question.focus()});
document.querySelector('#form').onsubmit=async event=>{event.preventDefault();if(!question.value.trim())return;send.disabled=true;document.querySelector('#result').hidden=true;let id;try{const job=await request('api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:question.value.trim()})});id=job.id;sessionStorage.setItem('rag-job',id);await poll(id)}catch(e){status(e.message+(id?' 任务编号：'+id:''),true)}finally{send.disabled=false}};
async function poll(id){const started=Date.now();for(;;){const job=await request('api/jobs/'+id);if(job.status==='completed'){show(job);status(job.cache?.status === 'hit' ? '已返回缓存答案' : '回答已生成');sessionStorage.removeItem('rag-job');return}if(job.status==='failed'){sessionStorage.removeItem('rag-job');throw new Error(job.error+' 任务编号：'+id)}status(labels[job.status]||job.status);await new Promise(resolve=>setTimeout(resolve,Date.now()-started<3000?200:1000))}}
(async()=>{try{const health=await request('health');status(health.paths_ready?'可以提问':'运行路径尚未就绪，请检查 /health',!health.paths_ready);const id=sessionStorage.getItem('rag-job');if(id){send.disabled=true;try{await poll(id)}finally{send.disabled=false}}}catch(e){status(e.message,true)}})();
</script></body></html>
