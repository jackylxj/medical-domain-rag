# First controlled experiment: 3,000 QA, one epoch, independent validation.
model_name_or_path: /mnt/workspace/models/Qwen2-7B-Instruct
template: qwen

# method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05

# dataset
dataset_dir: data/processed/medical_v1
dataset: huatuo_train_3000
eval_dataset: huatuo_validation
cutoff_len: 512
preprocessing_num_workers: 1
dataloader_num_workers: 0



# output
output_dir: outputs/qwen2_medical_pilot_v1
logging_steps: 50
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 1
plot_loss: true
report_to: none

# train
bf16: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
per_device_eval_batch_size: 1
num_train_epochs: 1.0
learning_rate: 0.0001
lr_scheduler_type: cosine
warmup_ratio: 0.05
disable_gradient_checkpointing: false
seed: 42