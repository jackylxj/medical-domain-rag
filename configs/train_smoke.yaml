# Smoke validation only: 200 available examples, 20 optimizer updates.
model_name_or_path: /mnt/workspace/models/Qwen2-7B-Instruct
template: qwen
stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,v_proj
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
dataset_dir: data/processed/smoke
dataset: huatuo_smoke
cutoff_len: 512
preprocessing_num_workers: 1
dataloader_num_workers: 0
bf16: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
max_steps: 20
learning_rate: 0.0001
lr_scheduler_type: constant
warmup_steps: 0
disable_gradient_checkpointing: false
seed: 42
output_dir: outputs/qwen2_medical_smoke_v1
logging_steps: 1
save_steps: 20
save_total_limit: 1
plot_loss: true
report_to: none
